<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lunar14</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#05070f;--panel:#0b1422;--edge:#3b5470;--txt:#d8f3ff;--ok:#8be36b;--yel:#ffd23f}
html,body{height:100%;margin:0;background:#000}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Press Start 2P','Courier New',monospace;color:var(--txt)}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;container-type:inline-size;cursor:pointer;user-select:none;-webkit-user-select:none;overflow:hidden;background:#000}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.layer{position:absolute;inset:0;pointer-events:none}
.hide{opacity:0;visibility:hidden}
/* title */
#title{text-align:center;transition:opacity .4s}
#title h1{margin:0;position:absolute;left:0;right:0;top:11%;font-size:10cqw;font-weight:400;color:var(--yel);letter-spacing:.6cqw;text-shadow:.5cqw .5cqw 0 #b45309,1cqw 1cqw 0 #1b1b3a}
#title .sub{position:absolute;left:0;right:0;top:34%;font-size:1.2cqw;color:#7fd0ff}
#title .start{position:absolute;left:0;right:0;top:44%;font-size:2.2cqw;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#caption{position:absolute;left:4cqw;bottom:4cqw;font-size:1.4cqw;color:var(--ok);transition:opacity .4s}
/* HUD */
#hud{transition:opacity 1s}
.panel{position:absolute;background:var(--panel);border:.3cqw solid var(--edge);box-shadow:inset 0 0 0 .2cqw #000,0 0 0 .2cqw #000;font-size:max(7px,1.05cqw)}
#top{left:3.8%;right:3.8%;top:7%;height:20%;display:flex;align-items:center;gap:2%;padding:0 1.5%}
.stat{display:flex;gap:.9cqw;align-items:center;flex:1}
.ico{width:5.4cqw;height:5.4cqw;border:.25cqw solid;border-radius:.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3cqw;font-size:.9cqw;flex:none;background:#050a14}
.ico img{width:2.6cqw;height:2.6cqw;image-rendering:pixelated}
.col{flex:1;display:flex;flex-direction:column;gap:.7cqw;min-width:0}
.bar{height:2.1cqw;border:.2cqw solid;padding:.2cqw;background:#02050a}
.bar i{display:block;height:100%}
.row{display:flex;justify-content:space-between;font-size:max(7px,1.15cqw)}
#time{font-size:max(6px,.95cqw);text-align:right;line-height:1.9;color:#8aa;flex:none;width:7.5cqw}
#time b{font-size:max(8px,1.4cqw);color:#fff;font-weight:400}
#strip{left:50%;transform:translateX(-50%);top:27%;padding:.8cqw 3cqw;white-space:nowrap}
.ok{color:var(--ok)}.y{color:var(--yel)}
#drone{left:3.8%;top:34%;width:20.5%;padding:1.2cqw 1.4cqw;line-height:2}
#crew{right:3.8%;top:34%;width:20.5%;padding:1.2cqw 1.4cqw;line-height:2}
#menu{left:50%;transform:translateX(-50%);bottom:3%;width:56%;height:12%;display:flex;justify-content:space-around;align-items:center}
.btn{display:flex;flex-direction:column;align-items:center;gap:.6cqw;font-size:max(6px,1.05cqw)}
.btn img{width:4.2cqw;height:4.2cqw;image-rendering:pixelated}
/* dialogue */
#dlg{left:22%;width:56%;bottom:17%;min-height:12%;padding:1.6cqw 2cqw 3.2cqw;font-size:max(8px,1.45cqw);line-height:1.9;transition:opacity .35s,transform .35s;background:#0a1020;border-color:#7fd0ff}
#dlg.hide{transform:translateY(3cqw)}
#dlg .nx{position:absolute;right:1.6cqw;bottom:.9cqw;font-size:max(6px,.95cqw);color:var(--yel);animation:blink 1s steps(2) infinite}
#cur{position:absolute;left:73%;top:73%;width:6cqw;image-rendering:pixelated;animation:hover 0.8s steps(4) infinite alternate;pointer-events:none;filter:drop-shadow(.3cqw .3cqw 0 rgba(0,0,0,.6))}
@keyframes hover{from{transform:translate(0,0)}to{transform:translate(-1.2cqw,-1.2cqw)}}
#fade{background:#000;opacity:0;transition:opacity 1.2s}
@media (prefers-reduced-motion:reduce){#cur,.start,.nx{animation:none}}
#top{top:3%;height:19%}
#clock{flex:none;width:15cqw;text-align:center;font-size:max(6px,.85cqw);line-height:2.1;border-left:.2cqw solid var(--edge);padding-left:1cqw}
#clock b{display:block;font-size:max(12px,2.6cqw);font-weight:400;color:var(--yel);line-height:1.5}
#clock u{text-decoration:none;color:#fff;font-size:max(8px,1.2cqw)}
#quota{left:26%;right:26%;top:24.5%;padding:1cqw 1.4cqw;font-size:max(6px,.95cqw);line-height:1.9;border-color:#ffd23f;background:rgba(11,20,34,.93)}
#quota h4{margin:0 0 .4cqw;font-size:max(7px,1.05cqw);font-weight:400;color:var(--yel)}
.q{display:flex;justify-content:space-between;gap:1cqw}.q.d{color:#5f8a70;text-decoration:line-through}.q.late{color:#ff8a6a}
.tip{margin-top:.5cqw;color:#7fd0ff;font-size:max(5px,.8cqw)}
#cm,#ap{top:24.5%;width:20.5%;padding:1.1cqw 1.3cqw;line-height:1.9;font-size:max(6px,.95cqw)}
#cm{left:3.8%}#ap{right:3.8%}
#cm .bar,#ap .bar{height:1.5cqw;margin:.3cqw 0 .8cqw;padding:.15cqw}
#menu{width:64%;pointer-events:auto}
.btn{cursor:pointer;text-align:center;line-height:1.5;padding:.3cqw .8cqw;border:.15cqw solid transparent}
.btn:hover{border-color:#7fd0ff;background:#12263d}
.btn img{pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);font-size:max(5px,.7cqw);padding:.3cqw .5cqw;background:#111;color:#ccc;border:.15cqw solid #888;white-space:nowrap;transition:opacity .4s}
#act{left:26%;width:48%;bottom:16.5%;max-height:40%;overflow:auto;padding:1.2cqw;pointer-events:auto;border-color:#7fd0ff;font-size:max(7px,1.05cqw);background:#0a1020}
.ar{display:flex;gap:1cqw;justify-content:space-between;padding:.8cqw 1cqw;border:.15cqw solid #27384f;margin:.5cqw 0;cursor:pointer}
.ar:hover{background:#12263d}.ar.x{filter:grayscale(1);opacity:.55;cursor:not-allowed}.ar.dn{color:var(--ok);cursor:default}
.ar .st{font-size:.85em;text-align:right}
#wm{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:20}
#wm .box{width:56%;padding:2.4cqw;background:var(--panel);border:.4cqw solid #ff4040;box-shadow:0 0 0 .3cqw #000;font-size:max(8px,1.3cqw);line-height:2.1;text-align:center}
#wm .mb2{display:flex;gap:2cqw;justify-content:center;margin-top:1.6cqw}
#wm button{font:inherit;font-size:max(8px,1.2cqw);padding:1cqw 2.4cqw;background:#12263d;color:#fff;border:.3cqw solid #7fd0ff;cursor:pointer}
#wm button.bad{border-color:#ff4040;color:#ff9a9a}
#wm button:hover{background:#1d3d5f}
#top{top:5.2%;height:18.5%}
#quota,#cm,#ap{top:25%}
#menu{width:72%}
#alb{left:0;right:0;top:0;height:4.4%;display:flex;gap:1.5cqw;align-items:center;justify-content:center;font-size:max(7px,1.3cqw);background:#8a0c0c;color:#fff;border:0;border-bottom:.3cqw solid #ff4040;box-shadow:none;animation:pulse .6s steps(2) infinite}
#alb img{height:2.2cqw;image-rendering:pixelated}
@keyframes pulse{50%{background:#3a0404}}
.stat.flash .ico,.stat.flash .bar{animation:fo .5s steps(2) infinite}
@keyframes fo{50%{border-color:#fff;filter:brightness(1.8)}}
#hud.gl .panel{translate:var(--gx,.5cqw) 0;filter:hue-rotate(40deg) brightness(1.5) contrast(1.3)}
#hud.gl #clock{opacity:.4}
#fx{position:absolute;inset:0;pointer-events:none;z-index:15}
#wm.emg{background:rgba(0,0,0,.3)}
.emg .box{border-color:#ff9a2a;width:62%}
.emg .mb2{flex-direction:column;gap:1cqw}.emg button{width:100%}
.opt{border:.2cqw solid #3b5470;margin:1cqw 0;padding:.8cqw 1cqw;font-size:.85em;text-align:left;line-height:1.8}
#pw{left:20%;width:60%;bottom:16.5%;padding:1.2cqw 1.6cqw;pointer-events:auto;border-color:#ffd23f;background:#0a1020;font-size:max(6px,.95cqw);line-height:1.8}
.pg{display:flex;gap:1.5cqw;align-items:baseline;border:.15cqw solid #3b5470;padding:.7cqw 1cqw;margin:.6cqw 0}.pg b{color:var(--yel);font-weight:400}.pg small{color:#8aa;font-size:.85em}
.pr{display:flex;align-items:center;gap:1.2cqw;margin:.7cqw 0}
.pn{width:15cqw;display:flex;gap:.8cqw;align-items:center}.pn img{width:2.4cqw;height:2.4cqw;image-rendering:pixelated}
.fl{width:9cqw;height:1cqw;background:#02050a;border:.15cqw solid #3b5470;position:relative;overflow:hidden;flex:none}
.fl i{position:absolute;inset:0;opacity:var(--e,0);background:repeating-linear-gradient(90deg,#ffd23f 0 .8cqw,transparent .8cqw 1.6cqw);animation:flow .6s steps(4) infinite}
@keyframes flow{to{background-position:1.6cqw 0}}
#pw input[type=range]{flex:1;accent-color:#ffd23f;height:1.4cqw;cursor:pointer}
.pv{width:5cqw;text-align:right}.pe{width:9cqw;text-align:right}
.pnote{font-size:max(5px,.8cqw);color:#7fd0ff;margin-top:.6cqw}
.hl{outline:.45cqw solid #ffd23f;outline-offset:.3cqw;animation:hlp .6s steps(2) infinite;position:relative;z-index:12}
@keyframes hlp{50%{outline-color:#fff;box-shadow:0 0 2cqw #ffd23f}}
.btn.lock{filter:grayscale(1) brightness(.45);pointer-events:none}
#dim{background:rgba(0,0,0,.55);z-index:11}
#tb{position:absolute;left:50%;transform:translateX(-50%);bottom:19%;padding:1.2cqw 3cqw;font:inherit;font-size:max(9px,1.8cqw);background:#12263d;border:.4cqw solid #ffd23f;color:#fff;cursor:pointer;z-index:12}
#dlg,#cur,#pw,#act{z-index:13}
.info .box{border-color:#7fd0ff;text-align:left;width:54%}
.info .hd{display:flex;gap:1.2cqw;align-items:center;color:var(--yel);margin-bottom:.6cqw}
.info .hd img{width:3.6cqw;height:3.6cqw;image-rendering:pixelated}
.info .il{font-size:.78em;color:#cfe8f5;line-height:2}
#bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#111;border:.25cqw solid #000;padding:.5cqw .8cqw;font-size:max(6px,.9cqw);z-index:14;pointer-events:none;white-space:nowrap}
#cd{position:absolute;left:0;right:0;top:20%;text-align:center;font-size:9cqw;color:#ffd23f;text-shadow:.5cqw .5cqw 0 #b45309;z-index:14;pointer-events:none}
#snd{position:absolute;right:.8cqw;bottom:.8cqw;z-index:14;font:inherit;font-size:max(6px,.8cqw);background:#0b1422;color:#8aa;border:.2cqw solid #3b5470;padding:.5cqw .8cqw;cursor:pointer}
.les{display:flex;gap:2cqw;align-items:flex-start}
.astro{width:12cqw;image-rendering:pixelated;border:.3cqw solid #3b5470;background:#0b1422;flex:none}
.lesson .box{width:66%;max-height:80%;overflow:auto}
.lesson .il{font-size:.8em;line-height:2}
#evac{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);padding:2cqw 5cqw;font:inherit;font-size:3.4cqw;background:#a01010;color:#fff;border:.6cqw solid #ffd23f;z-index:14;cursor:pointer;animation:pulse .5s steps(2) infinite;text-align:center}
#evac small{display:block;font-size:.34em;margin-top:1cqw;color:#ffd23f;line-height:1.6}
.wic{width:1.8cqw;height:1.8cqw;image-rendering:pixelated;vertical-align:middle;pointer-events:auto;cursor:pointer;animation:wb .6s steps(2) infinite}
@keyframes wb{50%{opacity:.25}}
.brand{position:absolute;left:3%;right:3%;bottom:3.5%;display:flex;justify-content:space-between;align-items:flex-end;font-size:max(6px,.95cqw);line-height:1.8}
.brand canvas{image-rendering:pixelated;width:6cqw;height:6cqw;flex:none}
.brand .bl,.brand .br{display:flex;gap:1.2cqw;align-items:center;background:rgba(5,10,20,.7);padding:.8cqw 1.4cqw;border:.2cqw solid #3b5470}
.brand .br{opacity:.85;font-size:max(7px,1.3cqw)}.brand .br canvas{width:3cqw;height:3cqw}
.stat.red{pointer-events:auto;cursor:pointer;position:relative}
.stat.red::after{content:"!";position:absolute;right:0;top:-.8cqw;background:#ff4040;color:#fff;font-size:1.3cqw;padding:.2cqw .7cqw}
.stat.red .ico{animation:fo .5s steps(2) infinite}
</style></head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="title" class="layer">
    <h1>LUNAR14</h1>
    <div class="sub">MOON BASE COLONY SIM</div>
    <div class="start">Click to Start</div>
    <div class="brand"><div class="bl"><canvas id="nasa" width="36" height="36"></canvas><span>NASA<br>SPACE APPS<br>CHALLENGE 2026</span></div><div class="br"><canvas id="clm" width="16" height="16"></canvas><span>Claude</span></div></div>
  </div>
  <div id="caption" class="layer hide" style="inset:auto auto 4cqw 4cqw"></div>

  <div id="hud" class="layer hide">
  <div id="alb" class="panel hide"></div><div id="top" class="panel"><div id="stats" style="display:contents"></div><div id="clock"></div></div>
  <div id="quota" class="panel"></div>
  <div id="cm" class="panel"></div>
  <div id="ap" class="panel"></div>
  <div id="menu" class="panel">
    <div class="btn" data-m="BUILD"><img data-i="build" data-c="#9aa6b2"><br>BUILD</div>
    <div class="btn" data-m="RESEARCH"><img data-i="flask" data-c="#4fb3ff"><br>RESEARCH</div>
    <div class="btn" data-m="DISPATCH"><img data-i="dispatch" data-c="#7fd0ff"><br>DISPATCH</div>
    <div class="btn" data-m="LOGISTICS"><img data-i="crate" data-c="#3fe08a"><br>LOGISTICS</div>
    <div class="btn" data-m="POWER"><img data-i="bolt" data-c="#ffd23f"><br>POWER /<br>ALLOCATION</div>
    <div class="btn" data-m="SLEEP"><img data-i="moon" data-c="#ffd23f"><br>REST / SLEEP<br>(END DAY)</div>
  </div>
</div>

<div id="dlg" class="panel hide layer" style="inset:auto;left:22%;bottom:17%"><span id="dtxt"></span><span class="nx">(click to next)</span></div>
  <img id="cur" class="hide" alt="">
  <div id="dim" class="layer hide"></div><button id="tb" class="hide"></button><div id="bub" class="hide"></div><div id="cd" class="hide"></div><button id="snd">SND: ON</button><button id="evac" class="hide"></button><canvas id="fx"></canvas><div id="pw" class="panel hide"></div><div id="act" class="panel hide"></div><div id="wm" class="hide"></div><div id="fade" class="layer"></div>
</div>

<script>
const W=320,H=180,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
const $=id=>document.getElementById(id);
let c=ctx;
const rng=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
const R=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
function ell(cx,cy,rx,ry,col,topOnly){c.fillStyle=col;for(let y=-ry;y<=(topOnly?0:ry);y++){const dx=Math.round(rx*Math.sqrt(1-y*y/(ry*ry)));c.fillRect(cx-dx,cy+y,dx*2+1,1)}}
const mk=()=>{const k=document.createElement('canvas');k.width=W;k.height=H;return k};

/* ---------- pixel icons ---------- */
const ICONS={
bolt:["....##..","...##...","..##....",".######.","...##...","..##....",".##.....","##......"],
bubble:["..####..",".#....#.","#..w...#","#......#","#......#","#......#",".#....#.","..####.."],
leaf:["......##","....####","..######",".#######","######..","#.####..","#.##....","#......."],
shield:["########","#######w","########","########",".######.","..####..","...##...","........"],
build:["..#####.","..#####.","...##...","...##...","...##...","...##...","...##...","...##..."],
flask:["..####..","...##...","...##...","..####..",".#wwww#.","########","########",".######."],
crate:["########","#.#..#.#","#..##..#","#..##..#","#..##..#","#.#..#.#","########","........"],
alert:["...##...","..####..","..#..#..",".#.##.#.",".#.##.#.","#..##..#","#......#","########"],
map:["########","#.#.#..#","#.#.#.##","###.#..#","#..##.##","##.#..##","#..#.#.#","########"],
gear:["...##...","#.####.#","########",".##..##.",".##..##.","########","#.####.#","...##..."],
dispatch:["..####..",".######.","##wwww##","##wwww##","##wwww##",".######.","..#..#..",".##..##."],moon:["..###...",".##.....","##......","##......","##......",".##...#.","..#####.","...###.."],warn:["...##...","..####..","..#ww#..",".##ww##.",".##ww##.","###..###","##.ww.##","########"],cursor:["#.........","##........","#w#.......","#ww#......","#www#.....","#wwww#....","#wwwww#...","#wwwwww#..","#wwwwwww#.","#wwwww####","#ww#ww#...","#w#.#ww#..","##..#ww#..","#....##..."]};
function icon(name,col,line){const g=ICONS[name],k=document.createElement('canvas');k.width=g[0].length;k.height=g.length;const x=k.getContext('2d');
 g.forEach((r,y)=>[...r].forEach((ch,i)=>{if(ch==='.')return;x.fillStyle=ch==='w'?'#fff':(line||col);x.fillRect(i,y,1,1)}));return k.toDataURL()}
document.querySelectorAll('img[data-i]').forEach(im=>im.src=icon(im.dataset.i,im.dataset.c));
$('cur').src=icon('cursor','#000','#111');

/* ---------- stars ---------- */
const r0=rng(3),stars=Array.from({length:130},()=>({x:Math.floor(r0()*W),y:Math.floor(r0()*H),b:r0()<.15?'#fff':'#7d8fb8',p:r0()*6}));
function drawStars(t,a,maxY){c.globalAlpha=a;stars.forEach(s=>{if(s.y>maxY)return;const on=Math.sin(t/500+s.p)>-.6;if(on)R(s.x,s.y,1,1,s.b)});c.globalAlpha=1}

/* ---------- moon texture ---------- */
const tex=document.createElement('canvas');tex.width=tex.height=200;
(function(){const t=tex.getContext('2d'),r=rng(7),rad=90,cr=[];
 for(let i=0;i<46;i++){const a=r()*6.28,d=Math.sqrt(r())*rad*.92;cr.push([100+Math.cos(a)*d,100+Math.sin(a)*d,2+r()*r()*14])}
 for(let i=0;i<14;i++)cr.push([100+(r()-.5)*44,166+r()*20,2+r()*8]);
 const pal=['#2f323a','#4a4d55','#6b6e77','#9094a0','#c4c7cf'];
 for(let y=0;y<200;y++)for(let x=0;x<200;x++){const dx=x-100,dy=y-100,d=Math.hypot(dx,dy);if(d>rad)continue;
  let l=.58-(dx+dy)/(2*rad)*.42-Math.pow(d/rad,4)*.22;
  if(Math.sin(x*.07)+Math.cos(y*.09+x*.03)>1)l-=.13;
  for(const [cx,cy,rr] of cr){const e=Math.hypot(x-cx,y-cy)/rr;if(e<1)l-=.13;else if(e<1.3&&(x-cx)+(y-cy)<0)l+=.1}
  t.fillStyle=pal[Math.max(0,Math.min(4,Math.floor(l*5)))];t.fillRect(x,y,1,1)}})();

/* ---------- base scene (static layer + module layers) ---------- */
const bg=mk(),MODS={},lamps=[[48,150],[92,160],[148,158],[212,146],[246,158],[280,172],[190,170]];
function panel(x,y,w,h,sk){for(let r=0;r<h;r++){const o=Math.floor(r*sk);R(x+o,y+r,w,1,r%5===0?'#0f2060':'#2650b8');for(let k=0;k<w;k+=7)R(x+o+k,y+r,1,1,'#0f2060')}R(x+w/2+h*sk/2,y+h,2,7,'#8a93a0')}
// each module = full-colour layer + auto-generated grayscale layer
function mod(name,box,glow,draw){const k=mk();c=k.getContext('2d');draw();const d=c.getImageData(0,0,W,H),g=mk(),gx=g.getContext('2d'),o=gx.createImageData(W,H);
 for(let i=0;i<d.data.length;i+=4){const l=Math.round((d.data[i]*.3+d.data[i+1]*.59+d.data[i+2]*.11)*.75);o.data[i]=o.data[i+1]=o.data[i+2]=l;o.data[i+3]=d.data[i+3]}
 gx.putImageData(o,0,0);c=ctx;MODS[name]={col:k,gry:g,box,glow}}
(function(){c=bg.getContext('2d');const r=rng(11);

  R(160-S(11),y0-S(14),S(22),S(9),'#d8dde3');R(160-S(11),y0-S(14),S(22),S(3),'#f4f6f8');R(160-S(11),y0-S(8),S(22),S(2),'#aeb8c4');
  R(160,y0-S(22),1,S(8),'#999');R(160-S(3),y0-S(23),S(6),S(2),'#ddd');R(160-S(9),y0-S(10),S(3),S(2),'#ff4040');R(160+S(6),y0-S(10),S(3),S(2),'#ff4040');ctx.globalAlpha=1}
 if(p>.75){ctx.fillStyle=`rgba(0,0,0,${(p-.75)/.25})`;ctx.fillRect(0,0,W,H)}

function rovLine(a){if(G.rovAway&&G.day>=G.rovBack){G.rovAway=0;G.water=cl(G.water+60);return['The rover seems to have returned safely! This is a great achievement!','It brought back frozen water ice from the PSR! WATER +60%.',...a]}return a}
function startEnding(){G.over=true;closeAct();state='ending';t0=performance.now();endTalk=0;endSp=0;sfx('whoosh');$('hud').classList.add('hide');hidePtr();$('wm').classList.add('hide');$('caption').classList.remove('hide')}
function drawEnding(t){c=ctx;
 for(let y=0;y<128;y++){const k=y/128;R(0,y,W,1,`rgb(${150+(80*k|0)},${205+(35*k|0)},${235+(15*k|0)})`)}
 [[34,34,26,3],[270,40,32,4],[240,104,44,3],[60,112,36,3],[150,20,22,2]].forEach(([x,y,rx,ry])=>ell(x,y,rx,ry,'#eef8fc'));
 for(let y=128;y<H;y++){const k=(y-128)/52;R(0,y,W,1,`rgb(${30-(14*k|0)},${100-(34*k|0)},${165-(34*k|0)})`)}
 R(0,127,W,1,'#3b7fb8');sp.forEach(s=>{if(Math.sin(t/300+s.p)>.5)R(s.x,s.y,2,1,'#8fcdf0')});
 const dp=Math.min(1,t/6500),e=1-Math.pow(1-dp,2),post=Math.max(0,(t-6500)/2200),capY=t>6500?127+Math.sin(t/350):70+52*e,capX=160+Math.sin(t/900)*3*(1-dp);
 ctx.globalAlpha=Math.max(0,1-post);
 [[-46,-58,30,15],[-2,-72,28,14],[38,-62,30,15]].forEach(([dx,dy,rx,ry])=>{const cx=capX+dx,cy=capY+dy+post*50;[-.8,-.3,.3,.8].forEach(f=>ln(cx+rx*f,cy,capX+f*2,capY-3,'#dfe8ee'));canopy(cx,cy,rx,ry)});
 ctx.globalAlpha=1;ell(capX,capY,6,3,'#1d1f27');R(capX-4,capY-3,5,1,'#5a5f70');R(capX-5,capY+4,10,1,'#2a5f94');
 if(t>6300){if(!endSp){endSp=1;sfx('splash')}for(let r=0;r<3;r++){const a=(t-6300-r*450)/1400;if(a>0&&a<1){ctx.globalAlpha=1-a;const rr=6+a*36;for(let q=0;q<6.28;q+=.12)R(capX+Math.cos(q)*rr,128+Math.sin(q)*rr*.2,1,1,'#fff')}}ctx.globalAlpha=1;
  const a=(t-6300)/700;if(a<1)for(let i=0;i<14;i++)R(capX+(i-7)*3*a,126-Math.sin(a*Math.PI)*(10+(i%4)*4),1,1,'#fff')}
 $('caption').textContent=t<6500?'> ORION RE-ENTRY: PARACHUTES DEPLOYED':'> SPLASHDOWN! PACIFIC OCEAN';
 if(t>8200&&!endTalk){endTalk=1;talk(['Congratulations! The crew has safely returned to Earth!'],false,null,()=>showReview(true,askNight))}}
function askNight(){modal('<span class="ok">MISSION COMPLETE!</span><br>The base is still in daylight.<br>Take on the LUNAR NIGHT, continuing from your current base?',[['YES: FACE THE LUNAR NIGHT',startNight],['NO: END MISSION',()=>modal('Thank you for playing Lunar14!',[['PLAY AGAIN',restart]])]])}
function startNight(){state='night';t0=performance.now();nightEnd=0;$('hud').classList.remove('hide');refresh();$('caption').classList.remove('hide')}
function drawNight(t,now){drawGame(now);const p=Math.min(1,t/7500);c=ctx;
 ctx.fillStyle=`rgba(255,120,40,${Math.sin(Math.min(1,p*1.8)*Math.PI)*.22})`;ctx.fillRect(0,0,W,H);
 ctx.fillStyle=`rgba(3,5,22,${Math.min(.84,Math.max(0,(p-.2)/.6)*.84)})`;ctx.fillRect(0,0,W,H);
 const g=Math.max(0,(p-.35)/.65);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.3*g;ell(165,112,52,32,'#e6d870',true);lamps.forEach(([x,y])=>ell(x,y,7,4,'#ffd060'));ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 drawStars(t,Math.min(1,p*1.6),95);$('hud').style.opacity=1-.4*p;

 if(p>=1&&!nightEnd){nightEnd=1;modal('<span style="color:#7fd0ff">THE LUNAR NIGHT HAS BEGUN</span><br>Sunlight is gone. Solar power is zero.<br>Survive on batteries and RTG power...<br><br>To be continued.',[['PLAY AGAIN',restart]],'info')}}
function restart(){state='title';stopVoice();closeAct();dlgOpen=false;hidePtr();HL=null;HINT=null;RQ.length=0;['wm','dlg','dim','caption','cd','bub','tb','evac','hud'].forEach(i=>$(i).classList.add('hide'));$('hud').style.opacity=1;const f=$('fade');f.style.transition='none';f.style.opacity=0;$('title').classList.remove('hide');reset();PT.length=0;refresh()}

$('stage').addEventListener('pointerdown',e=>{auInit();if(e.target.closest('#snd')){toggleSnd();return}
 if(state==='title')return startIntro();
 if(state==='ending'||state==='night'){if(dlgOpen&&!e.target.closest('#wm'))advance();return}
 if(state!=='game'||e.target.closest('#wm'))return;
 if(e.target.closest('#evac')){run('evac');return}
 if(G.busy)return;
 if(dlgOpen)return advance();
 if(e.target.closest('.wic')){showWarn('crew');return}
 const sm=e.target.closest('.stat.red');if(sm){showMeter(sm.dataset.k);return}
 if(G.tut){if(e.target.closest('.hl'))tutClick();return}   // tutorial: only the highlighted control works
 const b=e.target.closest('.btn');if(b)return menuClick(b.dataset.m);
 const r=e.target.closest('.ar');if(r)return run(r.dataset.id);
 if(!e.target.closest('#act,#pw')){closeAct();const w=hitWarn(e);if(w)showWarn(w)}});
reset();refresh();
